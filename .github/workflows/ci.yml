name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Site, thème et design
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: pdo_sqlite }
      - name: Fichiers générés à jour
        run: node design/build.mjs --check
      - name: En-tête / pied / bêta identiques site et blog
        run: node scripts/check-parity.mjs
      - name: Syntaxe PHP
        run: find web wp-theme -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Tests PHP
        run: php web/tests/run.php

  mobile:
    name: App Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Bundle Android (une fois les dossiers android/ générés)
        if: hashFiles('mobile/android/app/build.gradle.kts', 'mobile/android/app/build.gradle') != ''
        run: flutter build appbundle --debug
