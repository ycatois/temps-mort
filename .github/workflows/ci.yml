name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Site, thème et design
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: pdo_sqlite }
      - name: Fichiers générés à jour
        run: node design/build.mjs --check
      - name: En-tête / pied / bêta identiques site et blog
        run: node scripts/check-parity.mjs
      - name: Syntaxe PHP
        run: find web wp-theme -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Tests PHP
        run: php web/tests/run.php

  shared:
    name: Moteur de match (Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:jvmTest
        working-directory: mobile

  android:
    name: App Android
    needs: shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :androidApp:assembleDebug
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        with:
          name: temps-mort-debug.apk
          path: mobile/androidApp/build/outputs/apk/debug/*.apk

  ios:
    name: App iOS
    needs: shared
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: brew install xcodegen
      - run: xcodegen
        working-directory: mobile/iosApp
      - run: >
          xcodebuild -project TempsMort.xcodeproj -scheme TempsMort
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
        working-directory: mobile/iosApp
