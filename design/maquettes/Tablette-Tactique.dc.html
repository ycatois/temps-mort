<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tableau tactique – tablette</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#1E5BD6}a:hover{color:#14213D}
button{font-family:inherit}
</style>
</helmet>
<div style="width:1194px;height:834px;box-sizing:border-box;background:#EDF0F4;color:#182235;font-family:Barlow,system-ui,sans-serif;display:flex;flex-direction:column">

  <header style="background:#14213D;color:#FFFFFF;padding:14px 24px;display:flex;align-items:center;gap:20px">
    <a href="Main.dc.html" style="color:#FFFFFF;text-decoration:none;display:flex;align-items:center;gap:6px;font-size:16px;font-weight:600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>Retour au match</a>
    <h1 style="margin:0;font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;flex-grow:1">Tableau tactique · rotation 3 en réception</h1>
    <span style="font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700">18 – 15</span>
    <span style="background:#FFD23F;color:#14213D;border-radius:8px;padding:8px 12px;font-size:15px;font-weight:700">Temps mort · 0:24</span>
  </header>

  <main style="flex-grow:1;display:flex;gap:16px;padding:16px 24px 20px;min-height:0">
    <nav aria-label="Outils de dessin" style="width:84px;background:#FFFFFF;border:1px solid #D3DAE3;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:center">
      <button type="button" aria-label="Déplacer les pions" style="width:60px;height:60px;border:0;border-radius:12px;background:#E6EBF2;display:flex;align-items:center;justify-content:center">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#14213D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20M2 12h20M12 2l-3 3M12 2l3 3M12 22l-3-3M12 22l3-3M2 12l3-3M2 12l3 3M22 12l-3-3M22 12l-3 3"></path></svg></button>
      <button type="button" aria-label="Crayon" style="width:60px;height:60px;border:0;border-radius:12px;background:#14213D;display:flex;align-items:center;justify-content:center">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3l4 4L8 20H4v-4z"></path></svg></button>
      <button type="button" aria-label="Flèche" style="width:60px;height:60px;border:0;border-radius:12px;background:#E6EBF2;display:flex;align-items:center;justify-content:center">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#14213D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19 19 5M10 5h9v9"></path></svg></button>
      <button type="button" aria-label="Zone" style="width:60px;height:60px;border:0;border-radius:12px;background:#E6EBF2;display:flex;align-items:center;justify-content:center">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#14213D" stroke-width="2" stroke-dasharray="3 3" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"></rect></svg></button>
      <button type="button" aria-label="Ajouter un ballon" style="width:60px;height:60px;border:0;border-radius:12px;background:#E6EBF2;display:flex;align-items:center;justify-content:center">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#14213D" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 3c3 3 3 15 0 18M3.5 9c5 1 12 1 17 0"></path></svg></button>
      <div style="width:60px;height:1px;background:#D3DAE3;margin:4px 0"></div>
      <button type="button" aria-label="Couleur jaune" style="width:40px;height:40px;border-radius:50%;background:#FFD23F;border:3px solid #14213D"></button>
      <button type="button" aria-label="Couleur rouge" style="width:40px;height:40px;border-radius:50%;background:#D9362B;border:2px solid #FFFFFF;box-shadow:0 0 0 1px #D3DAE3"></button>
      <button type="button" aria-label="Couleur blanche" style="width:40px;height:40px;border-radius:50%;background:#FFFFFF;border:2px solid #D3DAE3"></button>
      <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px">
        <button type="button" aria-label="Annuler le dernier trait" style="width:60px;height:60px;border:0;border-radius:12px;background:#E6EBF2;display:flex;align-items:center;justify-content:center">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#14213D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-3"></path></svg></button>
        <button type="button" aria-label="Tout effacer" style="width:60px;height:60px;border:2px solid #C2541C;border-radius:12px;background:#FFFFFF;display:flex;align-items:center;justify-content:center">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9A3F12" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button>
      </div>
    </nav>

    <section aria-label="Terrain" style="flex-grow:1;position:relative;background:#2E5A95;border-radius:14px;min-width:0">
      <div style="position:absolute;left:60px;top:24px;width:560px;height:180px;background:#E2B48A;box-sizing:border-box;border:3px solid #FFFFFF;border-bottom:0;opacity:.7"></div>
      <div style="position:absolute;left:52px;top:204px;width:576px;height:8px;background:#FFFFFF;border-radius:4px"></div>
      <span style="position:absolute;left:320px;top:186px;font-size:12px;color:#14213D;font-weight:700;letter-spacing:.1em">FILET</span>
      <div style="position:absolute;left:60px;top:212px;width:560px;height:500px;background:#EFA35C;box-sizing:border-box;border:3px solid #FFFFFF;border-top:0"></div>
      <div style="position:absolute;left:60px;top:378px;width:560px;height:3px;background:#FFFFFF"></div>

      <span style="position:absolute;left:120px;top:96px;width:44px;height:44px;border-radius:50%;background:#FFFFFF;color:#9A3F12;border:3px solid #C2541C;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700">A</span>
      <span style="position:absolute;left:318px;top:96px;width:44px;height:44px;border-radius:50%;background:#FFFFFF;color:#9A3F12;border:3px solid #C2541C;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700">A</span>
      <span style="position:absolute;left:516px;top:96px;width:44px;height:44px;border-radius:50%;background:#FFFFFF;color:#9A3F12;border:3px solid #C2541C;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700">A</span>

      <svg width="680" height="760" viewBox="0 0 680 760" style="position:absolute;left:0;top:0" aria-hidden="true">
        <path d="M 182 470 C 230 420, 280 360, 330 300" fill="none" stroke="#FFD23F" stroke-width="5" stroke-linecap="round"></path>
        <path d="M 318 292 L 332 298 L 326 312" fill="none" stroke="#FFD23F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="M 500 640 C 520 560, 540 470, 560 420" fill="none" stroke="#FFD23F" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 9"></path>
        <rect x="92" y="560" width="200" height="120" rx="14" fill="#D9362B" fill-opacity=".18" stroke="#D9362B" stroke-width="3" stroke-dasharray="9 7"></rect>
      </svg>
      <span style="position:absolute;left:104px;top:690px;background:#FFFFFF;color:#9F1F16;font-size:13px;font-weight:700;padding:3px 8px;border-radius:6px">Zone à couvrir</span>

      <span style="position:absolute;left:110px;top:250px;width:84px;height:84px;border-radius:50%;background:#14213D;color:#FFFFFF;border:3px solid #FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center"><span style="font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;line-height:1">3</span><span style="font-size:13px;font-weight:600">Inès</span></span>
      <span style="position:absolute;left:298px;top:230px;width:84px;height:84px;border-radius:50%;background:#14213D;color:#FFFFFF;border:3px solid #FFD23F;display:flex;flex-direction:column;align-items:center;justify-content:center"><span style="font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;line-height:1">5</span><span style="font-size:13px;font-weight:600">Manon</span></span>
      <span style="position:absolute;left:490px;top:250px;width:84px;height:84px;border-radius:50%;background:#14213D;color:#FFFFFF;border:3px solid #FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center"><span style="font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;line-height:1">12</span><span style="font-size:13px;font-weight:600">Emma</span></span>
      <span style="position:absolute;left:140px;top:436px;width:84px;height:84px;border-radius:50%;background:#14213D;color:#FFFFFF;border:3px solid #FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center"><span style="font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;line-height:1">7</span><span style="font-size:13px;font-weight:600">Lucie</span></span>
      <span style="position:absolute;left:298px;top:470px;width:84px;height:84px;border-radius:50%;background:#FFFFFF;color:#14213D;border:3px solid #14213D;display:flex;flex-direction:column;align-items:center;justify-content:center"><span style="font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;line-height:1">1</span><span style="font-size:13px;font-weight:600">Jade · L</span></span>
      <span style="position:absolute;left:456px;top:436px;width:84px;height:84px;border-radius:50%;background:#14213D;color:#FFFFFF;border:3px solid #FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center"><span style="font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;line-height:1">9</span><span style="font-size:13px;font-weight:600">Chloé</span></span>

      <div role="group" aria-label="Vue" style="position:absolute;right:16px;top:16px;display:flex;background:#FFFFFF;border-radius:10px;padding:4px">
        <button type="button" style="border:0;background:transparent;color:#182235;padding:8px 12px;border-radius:8px;font-size:14px;font-weight:600">Demi-terrain</button>
        <button type="button" style="border:0;background:#14213D;color:#FFFFFF;padding:8px 12px;border-radius:8px;font-size:14px;font-weight:700">Terrain entier</button>
      </div>
    </section>

    <aside aria-label="Schémas" style="width:300px;background:#FFFFFF;border:1px solid #D3DAE3;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px">
      <h2 style="margin:0;font-size:18px;font-weight:700">Schémas enregistrés</h2>
      <button type="button" style="height:52px;border:0;border-radius:10px;background:#14213D;color:#FFFFFF;font-size:15px;font-weight:700">Replacer sur la rotation du match</button>
      <ul style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px">
        <sc-for list="{{plays}}" as="p" hint-placeholder-count="6">
          <li style="border:1px solid #D3DAE3;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-height:44px;box-sizing:border-box">
            <span style="font-size:15px;font-weight:600">{{p.name}}</span>
            <span style="font-size:13px;color:#5B6577">{{p.meta}}</span>
          </li>
        </sc-for>
      </ul>
      <button type="button" style="margin-top:auto;height:52px;border:2px solid #14213D;border-radius:10px;background:#FFFFFF;color:#14213D;font-size:15px;font-weight:700">Enregistrer ce schéma</button>
    </aside>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      plays: [
        { name: 'Réception R1 · 5-1', meta: 'Modèle · 6x6' },
        { name: 'Réception R3 · 5-1', meta: 'Modèle · 6x6' },
        { name: 'Couverture d’attaque zone 4', meta: 'Enregistré le 8 nov.' },
        { name: 'Défense contre pointue adverse', meta: 'Enregistré le 8 nov.' },
        { name: 'Réception 4x4 en W', meta: 'Modèle · 4x4' }
      ]
    };
  }
}
</script>
</body>
</html>
