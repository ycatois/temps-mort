include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    prefer_single_quotes: true
    prefer_final_locals: true
    avoid_print: true
    # Le moteur de règles (lib/domain) ne doit jamais importer Flutter : vérifié par test/domain/purete_test.dart
