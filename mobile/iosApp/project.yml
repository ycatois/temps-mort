# Projet Xcode généré par XcodeGen (brew install xcodegen ; puis `xcodegen` dans ce dossier).
# Le .xcodeproj n'est pas commité : ce fichier est la source.
name: TempsMort
options:
  bundleIdPrefix: fr.hasteria
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"   # mode Swift 5 : interop Kotlin sans friction de concurrence stricte
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: ""   # à renseigner (compte Apple Developer d'Hasteria)
targets:
  TempsMort:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Temps Mort
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
        UIAppFonts:   # noms seuls : XcodeGen copie les polices à plat dans le bundle
          - barlow_regular.ttf
          - barlow_medium.ttf
          - barlow_semibold.ttf
          - barlow_bold.ttf
          - barlow_condensed_semibold.ttf
          - barlow_condensed_bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.hasteria.tempsmort
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone et iPad
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, Shared]
    preBuildScripts:
      - name: Compiler le module Kotlin partagé
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
